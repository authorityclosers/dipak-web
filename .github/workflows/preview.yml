name: Preview Deploy - preview.dipakvishwakarma.com

# Deploys redesign branches to a separate preview container. Production
# (deploy.yml, container dipak-web) is never touched by this workflow.
on:
  push:
    branches:
      - "redesign/**"
  workflow_dispatch:

concurrency:
  group: preview-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy-preview:
    name: Build & Deploy Preview
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint & Typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Next.js Build (preview)
        env:
          SITE_ENV: preview
        run: npm run build

      - name: Assemble Standalone Bundle
        run: |
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          rm -rf .next/standalone/public/test-snapshots

          # Keep only media originals that source still references; every
          # rendered photograph ships from public/optimized.
          python3 - <<'PYEOF'
          import os, re
          referenced = set()
          for root, _, files in os.walk('src'):
              for f in files:
                  try:
                      with open(os.path.join(root, f), 'r', encoding='utf-8', errors='ignore') as sf:
                          referenced.update(re.findall(r'/media/([a-zA-Z0-9_\-\.]+)', sf.read()))
                  except Exception:
                      pass
          referenced.update({
              'dipak-vishwakarma-portrait-connect.webp',
              'dipak-vishwakarma-portrait-connect.jpg',
          })
          media_dir = '.next/standalone/public/media'
          if os.path.exists(media_dir):
              for f in os.listdir(media_dir):
                  fp = os.path.join(media_dir, f)
                  if not os.path.isdir(fp) and f not in referenced:
                      os.remove(fp)
          print(f"Preserved {len(referenced)} referenced media files")
          PYEOF

          cat > .next/standalone/Dockerfile << 'DOCKERFILE'
          FROM node:22-alpine
          WORKDIR /app
          ENV NODE_ENV=production NEXT_TELEMETRY_DISABLED=1 HOSTNAME=0.0.0.0 PORT=3000
          RUN addgroup --system --gid 1001 nodejs && adduser --system --uid 1001 nextjs
          COPY --chown=nextjs:nodejs . ./
          USER nextjs
          EXPOSE 3000
          CMD ["node", "server.js"]
          DOCKERFILE

          echo "Bundle size: $(du -sh .next/standalone | cut -f1)"

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat <<EOF > ~/.ssh/config
          Host production
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking accept-new
            IdentitiesOnly yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Rsync Bundle to Preview Directory
        run: |
          ssh production "mkdir -p /home/nivi/apps/dipak-web-preview"
          rsync -az --delete \
            --exclude='*.tar.gz' \
            .next/standalone/ production:/home/nivi/apps/dipak-web-preview/
          scp docker-compose.preview.yml production:/home/nivi/apps/dipak-web-preview/docker-compose.preview.yml

      - name: Build Image & Restart Preview Container
        run: |
          ssh production << 'REMOTE'
            set -e
            cd /home/nivi/apps/dipak-web-preview

            echo "--- Building preview image ---"
            docker build -t dipak-web-preview-image:latest .

            echo "--- Swapping preview container ---"
            docker stop dipak-web-preview 2>/dev/null || true
            docker rm   dipak-web-preview 2>/dev/null || true
            docker compose -p dipak-web-preview -f docker-compose.preview.yml up -d dipak-web-preview

            docker image prune -f || true
          REMOTE

      - name: Health Check
        run: |
          for i in $(seq 1 30); do
            if ssh -T production "docker exec dipak-web-preview node -e 'fetch(\"http://127.0.0.1:3000/api/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'"; then
              echo "Attempt $i → preview healthy"
              exit 0
            fi
            echo "Attempt $i → waiting for preview"
            sleep 2
          done
          echo "❌ Preview health check failed"
          ssh -T production "docker logs --tail=50 dipak-web-preview" || true
          exit 1
